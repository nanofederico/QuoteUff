JavaScript
Papa.parse("IMMATRICOLATO.csv", {
download: true,
header: true,
skipEmptyLines: true,
 
complete: function(results) {
 
console.log(results.data);
 
const data = results.data;
 
document.getElementById("tivCY").innerHTML =
data.length;
 
const iveco =
data.filter(
x => x["Make Central b"] === "IVECO"
).length;
 
const ms =
(iveco / data.length) * 100;
 
document.getElementById("msCY").innerHTML =
ms.toFixed(2) + "%";
 
const counts = {};
 
data.forEach(r => {
 
const make = r["Make Central b"];
 
if (!make) return;
 
counts[make] =
(counts[make] || 0) + 1;
 
});
 
new Chart(
document.getElementById("brandChart"),
{
type: "bar",
data: {
labels: Object.keys(counts),
datasets: [{
label: "Immatricolazioni",
data: Object.values(counts)
}]
}
}
);
 
}
});
